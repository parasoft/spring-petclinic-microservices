# Configuration settings for the Jtest runtime coverage agent
# Usage:
#   java -javaagent:[path to]/agent.jar=settings=[path to]/agent.properties

# ---------------------------------------------------------------------------
# Static settings — common to all services, do not change
# ---------------------------------------------------------------------------

# A comma-separated list of patterns that specify classes to be instrumented
jtest.agent.includes=org/springframework/samples/**

# A comma-separated list of class patterns to be excluded from instrumentation
jtest.agent.excludes=jakarta/**,java/**,javax/**,org/apache/**

# Enables/disables automatic start of a runtime data collection session
jtest.agent.session.autostart=false

# Enables/disables collecting web application coverage for multiple users
jtest.agent.enableMultiuserCoverage=true

# Enables/disables automatic loading of multiuser libraries (OpenTelemetry javaagent)
jtest.agent.autoloadMultiuserLibs=true

# Enables/disables remote access to coverage sessions
jtest.agent.restServerEnabled=true

# Sets up agent REST server communication port
jtest.agent.restServerPort=8050

# Enables/disables verbose output to console
#jtest.agent.debug=false

# Enables the agent to collect coverage using the JaCoCo engine
#jtest.agent.enableJacoco=false

# Turns off agent introduction printed out to console, default is false
#jtest.agent.silentMode=true

# Allows to specify test id and testcase id which will automatically assigned to collected coverage data
#jtest.agent.defaultTest=[ test id]
#jtest.agent.defaultTestCase=[ test case id]

# Turns on SSL in agent rest service, default is false
#jtest.agent.useSSL=true

#SSL settings
#jtest.agent.certificateStorePath=[path to]
#jtest.agent.certificateKeyPassword=[key password]
#jtest.agent.certificateStorePassword=[store password]
#jtest.agent.certificateStoreType=[store type]

# Enables collecting coverage for test classes, default is false
#jtest.agent.collectTestCoverage=true

# Do not fail instrumentation if verification fails, default is false
#jtest.agent.doNotFailOnVerification=true

#Enable agent JMX registration, default is true, set to false may solve issues with JMX registration on JBoss/Wildfly servers
#jtest.agent.enableJmxRegistration=true

# Specifies the ant path patterns to location(s) for which application hash will be calculated,
# for windows paths use single forward slashes or double backslashes
#jtest.agent.appLocationIncludes=/path/to/application/classes/**,/path/to/application/jars/*.jar
# Specifies the ant path patterns to exclude from application hash calculation
#jtest.agent.appLocationExcludes=/path/to/application/jars/*.so,/path/to/application/jars/thirdparty/libs/**

# Specifies where the runtime data will be stored; set via -javaagent runtimeData= arg in Docker deployments
#jtest.agent.runtimeData=/tmp/coverage/runtime_coverage

# ---------------------------------------------------------------------------
# Dynamic settings — edit these for your CTP/DTP environment.
# In Jenkins, Jenkinsfile.deploy patches all values below automatically.
# ---------------------------------------------------------------------------

# Use an agent-initiated (WebSocket) connection to Continuous Testing Platform (CTP)
ctp.websocket.url=ws://ctp:8080/em/coverage/websocket

# Subscribe to coverage events from a specific environment and component in CTP.
# Pattern: /user/queue/environments/{environmentId}/components/{componentId}/coverage
# Jenkinsfile.deploy resolves and sets this value automatically per service.
ctp.subscription.queue=/user/queue/environments/3/components/4/coverage

# Configure CTP to report coverage to a specified DTP project
dtp.project=spring-petclinic-microservices

# Configure CTP to report coverage to a specified DTP build ID
dtp.buildID=spring-petclinic-microservices-baseline

# Configure CTP to report coverage to specified images in DTP
dtp.coverageImages=spring-petclinic-microservices;spring-petclinic-microservices-FT

# Configure CTP to use a specified DTP filter ID for Test Impact Analysis (TIA)
dtp.filterID=3
