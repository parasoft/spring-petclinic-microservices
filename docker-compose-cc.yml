#version: '2'
#
# Profiles:
#   single  - one instance per service, coverage agent args via ${COV_AGENT_ARGS}
#   lb      - two instances per service behind nginx load balancer, hardcoded agent args
#
# Usage:
#   docker-compose -f docker-compose-cc.yml --profile single up
#   docker-compose -f docker-compose-cc.yml --profile lb up

services:

  # ---------------------------------------------------------------------------
  # Shared infrastructure (started with any profile)
  # ---------------------------------------------------------------------------

  config-server:
    image: springcommunity/spring-petclinic-config-server
    container_name: config-server
    networks:
      - demo-net
    mem_limit: 512M
    ports:
      - 8888:8888

  discovery-server:
    image: springcommunity/spring-petclinic-discovery-server
    container_name: discovery-server
    networks:
      - demo-net
    mem_limit: 512M
    depends_on:
      - config-server
    entrypoint: ["./dockerize","-wait=tcp://config-server:8888","-timeout=60s","--","java", "org.springframework.boot.loader.JarLauncher"]
    ports:
      - 8761:8761

  tracing-server:
    image: openzipkin/zipkin
    container_name: tracing-server
    mem_limit: 512M
    networks:
      - demo-net
    environment:
      - JAVA_OPTS=-XX:+UnlockExperimentalVMOptions -Djava.security.egd=file:/dev/./urandom
    ports:
      - 9411:9411

  admin-server:
    image: springcommunity/spring-petclinic-admin-server
    container_name: admin-server
    mem_limit: 512M
    networks:
      - demo-net
    depends_on:
      - config-server
      - discovery-server
    entrypoint: ["./dockerize","-wait=tcp://discovery-server:8761","-timeout=60s","--","java", "org.springframework.boot.loader.JarLauncher"]
    ports:
      - 9099:9090

  # ---------------------------------------------------------------------------
  # Profile: single
  # ---------------------------------------------------------------------------

  customers-service:
    profiles: [single]
    image: springcommunity/spring-petclinic-customers-service
    container_name: customers-service
    networks:
      - demo-net
    mem_limit: 512M
    depends_on:
      - config-server
      - discovery-server
    entrypoint: ["./dockerize","-wait=tcp://discovery-server:8761","-timeout=60s","--","java", "${COV_AGENT_ARGS}", "org.springframework.boot.loader.JarLauncher"]
    ports:
      - 8081:8081
      - 8052:8050
    volumes:
      - type: bind
        source: ./spring-petclinic-customers-service/src/test/resources/coverage
        target: /tmp/coverage

  visits-service:
    profiles: [single]
    image: springcommunity/spring-petclinic-visits-service
    container_name: visits-service
    user: 0:0
    mem_limit: 512M
    networks:
      - demo-net
    depends_on:
      - config-server
      - discovery-server
    entrypoint: ["./dockerize","-wait=tcp://discovery-server:8761","-timeout=60s","--","java", "${COV_AGENT_ARGS}", "org.springframework.boot.loader.JarLauncher"]
    ports:
      - 8082:8082
      - 8054:8050 # cov agent
    volumes:
      - type: bind
        source: ./spring-petclinic-visits-service/src/test/resources/coverage
        target: /tmp/coverage

  vets-service:
    profiles: [single]
    user: root:root
    image: springcommunity/spring-petclinic-vets-service
    container_name: vets-service
    mem_limit: 512M
    networks:
      - demo-net
    depends_on:
      - config-server
      - discovery-server
    entrypoint: ["./dockerize","-wait=tcp://discovery-server:8761","-timeout=60s","--","java", "${COV_AGENT_ARGS}", "org.springframework.boot.loader.JarLauncher"]
    ports:
      - 8083:8083
      - 8053:8050 # cov agent
    volumes:
      - type: bind
        source: ./spring-petclinic-vets-service/src/test/resources/coverage
        target: /tmp/coverage

  api-gateway:
    profiles: [single]
    image: springcommunity/spring-petclinic-api-gateway
    container_name: api-gateway
    mem_limit: 512M
    networks:
      - demo-net
    depends_on:
      - config-server
      - discovery-server
    entrypoint: ["./dockerize","-wait=tcp://discovery-server:8761","-timeout=60s","--","java", "${COV_AGENT_ARGS}", "org.springframework.boot.loader.JarLauncher"]
    ports:
      - 8099:8080
      - 8051:8050 # cov agent
    volumes:
      - type: bind
        source: ./spring-petclinic-api-gateway/src/test/resources/coverage
        target: /tmp/coverage

  # ---------------------------------------------------------------------------
  # Profile: lb
  # ---------------------------------------------------------------------------

  customers-service-1:
    profiles: [lb]
    image: springcommunity/spring-petclinic-customers-service
    container_name: customers-service-1
    networks:
      - demo-net
    mem_limit: 512M
    depends_on:
      - config-server
      - discovery-server
    entrypoint: ["./dockerize","-wait=tcp://discovery-server:8761","-timeout=60s","--","java", "-javaagent:/tmp/coverage/agent.jar=settings=/tmp/coverage/agent.properties,runtimeData=/tmp/coverage/runtime_coverage_customer1", "org.springframework.boot.loader.JarLauncher"]
    ports:
      - 8081:8081
      - 8052:8050 # cov agent
    volumes:
      - type: bind
        source: ./spring-petclinic-customers-service/src/test/resources/coverage
        target: /tmp/coverage

  customers-service-2:
    profiles: [lb]
    image: springcommunity/spring-petclinic-customers-service
    container_name: customers-service-2
    networks:
      - demo-net
    mem_limit: 512M
    depends_on:
      - config-server
      - discovery-server
    entrypoint: ["./dockerize","-wait=tcp://discovery-server:8761","-timeout=60s","--","java", "-javaagent:/tmp/coverage/agent.jar=settings=/tmp/coverage/agent.properties,runtimeData=/tmp/coverage/runtime_coverage_customer2", "org.springframework.boot.loader.JarLauncher"]
    ports:
      - 8086:8081
      - 8056:8050 # cov agent
    volumes:
      - type: bind
        source: ./spring-petclinic-customers-service/src/test/resources/coverage
        target: /tmp/coverage

  visits-service-1:
    profiles: [lb]
    image: springcommunity/spring-petclinic-visits-service
    container_name: visits-service-1
    user: 0:0
    mem_limit: 512M
    networks:
      - demo-net
    depends_on:
      - config-server
      - discovery-server
    entrypoint: ["./dockerize","-wait=tcp://discovery-server:8761","-timeout=60s","--","java", "-javaagent:/tmp/coverage/agent.jar=settings=/tmp/coverage/agent.properties,runtimeData=/tmp/coverage/runtime_coverage_visit1", "org.springframework.boot.loader.JarLauncher"]
    ports:
      - 8082:8082
      - 8054:8050 # cov agent
    volumes:
      - type: bind
        source: ./spring-petclinic-visits-service/src/test/resources/coverage
        target: /tmp/coverage

  visits-service-2:
    profiles: [lb]
    image: springcommunity/spring-petclinic-visits-service
    container_name: visits-service-2
    user: 0:0
    mem_limit: 512M
    networks:
      - demo-net
    depends_on:
      - config-server
      - discovery-server
    entrypoint: ["./dockerize","-wait=tcp://discovery-server:8761","-timeout=60s","--","java", "-javaagent:/tmp/coverage/agent.jar=settings=/tmp/coverage/agent.properties,runtimeData=/tmp/coverage/runtime_coverage_visit2", "org.springframework.boot.loader.JarLauncher"]
    ports:
      - 8088:8082
      - 8058:8050 # cov agent
    volumes:
      - type: bind
        source: ./spring-petclinic-visits-service/src/test/resources/coverage
        target: /tmp/coverage

  vets-service-1:
    profiles: [lb]
    user: root:root
    image: springcommunity/spring-petclinic-vets-service
    container_name: vets-service-1
    mem_limit: 512M
    networks:
      - demo-net
    depends_on:
      - config-server
      - discovery-server
    entrypoint: ["./dockerize","-wait=tcp://discovery-server:8761","-timeout=60s","--","java", "-javaagent:/tmp/coverage/agent.jar=settings=/tmp/coverage/agent.properties,runtimeData=/tmp/coverage/runtime_coverage_vets1", "org.springframework.boot.loader.JarLauncher"]
    ports:
      - 8083:8083
      - 8053:8050 # cov agent
    volumes:
      - type: bind
        source: ./spring-petclinic-vets-service/src/test/resources/coverage
        target: /tmp/coverage

  vets-service-2:
    profiles: [lb]
    user: root:root
    image: springcommunity/spring-petclinic-vets-service
    container_name: vets-service-2
    mem_limit: 512M
    networks:
      - demo-net
    depends_on:
      - config-server
      - discovery-server
    entrypoint: ["./dockerize","-wait=tcp://discovery-server:8761","-timeout=60s","--","java", "-javaagent:/tmp/coverage/agent.jar=settings=/tmp/coverage/agent.properties,runtimeData=/tmp/coverage/runtime_coverage_vets2", "org.springframework.boot.loader.JarLauncher"]
    ports:
      - 8087:8083
      - 8057:8050 # cov agent
    volumes:
      - type: bind
        source: ./spring-petclinic-vets-service/src/test/resources/coverage
        target: /tmp/coverage

  api-gateway-1:
    profiles: [lb]
    image: springcommunity/spring-petclinic-api-gateway
    container_name: api-gateway-1
    mem_limit: 512M
    networks:
      - demo-net
    depends_on:
      - config-server
      - discovery-server
    entrypoint: ["./dockerize","-wait=tcp://discovery-server:8761","-timeout=60s","--","java", "-javaagent:/tmp/coverage/agent.jar=settings=/tmp/coverage/agent.properties,runtimeData=/tmp/coverage/runtime_coverage_api_gateway1", "org.springframework.boot.loader.JarLauncher"]
    ports:
      - 8051:8050 # cov agent
    volumes:
      - type: bind
        source: ./spring-petclinic-api-gateway/src/test/resources/coverage
        target: /tmp/coverage

  api-gateway-2:
    profiles: [lb]
    image: springcommunity/spring-petclinic-api-gateway
    container_name: api-gateway-2
    mem_limit: 512M
    networks:
      - demo-net
    depends_on:
      - config-server
      - discovery-server
    entrypoint: ["./dockerize","-wait=tcp://discovery-server:8761","-timeout=60s","--","java", "-javaagent:/tmp/coverage/agent.jar=settings=/tmp/coverage/agent.properties,runtimeData=/tmp/coverage/runtime_coverage_api_gateway2", "org.springframework.boot.loader.JarLauncher"]
    ports:
      - 8055:8050 # cov agent
    volumes:
      - type: bind
        source: ./spring-petclinic-api-gateway/src/test/resources/coverage
        target: /tmp/coverage

  petclinic-lb:
    profiles: [lb]
    image: nginx:alpine
    container_name: petclinic-lb
    networks:
      - demo-net
    mem_limit: 128M
    depends_on:
      - api-gateway-1
      - api-gateway-2
    ports:
      - 8099:80
    volumes:
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true

networks:
  demo-net:
    external: true
    name: demo-net
