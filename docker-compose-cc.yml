#version: '2'
services:
  config-server:
    image: springcommunity/spring-petclinic-config-server
    container_name: config-server
    networks:
      - demo-net
    mem_limit: 512M
    ports:
     - 8888:8888

  discovery-server:
    image: springcommunity/spring-petclinic-discovery-server
    container_name: discovery-server
    networks:
      - demo-net
    mem_limit: 512M
    depends_on:
      - config-server
    entrypoint: ["./dockerize","-wait=tcp://config-server:8888","-timeout=60s","--","java", "org.springframework.boot.loader.JarLauncher"]
    ports:
     - 8761:8761

  customers-service:
    image: springcommunity/spring-petclinic-customers-service
    container_name: customers-service
    networks:
      - demo-net
    mem_limit: 512M
    depends_on:
     - config-server
     - discovery-server
    entrypoint: ["./dockerize","-wait=tcp://discovery-server:8761","-timeout=60s","--","java", "${COV_AGENT_ARGS}", "org.springframework.boot.loader.JarLauncher"]
    ports:
    - 8081:8081
    - 8052:8050
    volumes:
      - type: bind
        source: ./spring-petclinic-customers-service/src/test/resources/coverage
        target: /tmp/coverage
  visits-service:
    image: springcommunity/spring-petclinic-visits-service
    container_name: visits-service
    user: 0:0
    mem_limit: 512M
    networks:
      - demo-net
    depends_on:
     - config-server
     - discovery-server
    ports:
     - 8082:8082
     - 8054:8050 # cov agent
    volumes:
      - type: bind
        source: ./spring-petclinic-visits-service/src/test/resources/coverage
        target: /tmp/coverage
    entrypoint: ["./dockerize","-wait=tcp://discovery-server:8761","-timeout=60s","--","java", "${COV_AGENT_ARGS}", "org.springframework.boot.loader.JarLauncher"]
    
  vets-service:
    user: root:root
    image: springcommunity/spring-petclinic-vets-service
    container_name: vets-service
    mem_limit: 512M
    networks:
      - demo-net
    depends_on:
     - config-server
     - discovery-server
    ports:
     - 8083:8083
     - 8053:8050 # cov agent
    volumes:
      - type: bind
        source: ./spring-petclinic-vets-service/src/test/resources/coverage
        target: /tmp/coverage
    entrypoint: ["./dockerize","-wait=tcp://discovery-server:8761","-timeout=60s","--","java", "${COV_AGENT_ARGS}", "org.springframework.boot.loader.JarLauncher"]

  api-gateway:
    image: springcommunity/spring-petclinic-api-gateway
    container_name: api-gateway
    mem_limit: 512M
    networks:
      - demo-net
    depends_on:
     - config-server
     - discovery-server
    ports:
     - 8099:8080
     - 8051:8050 # cov agent
    volumes:
      - type: bind
        source: ./spring-petclinic-vets-service/src/test/resources/coverage
        target: /tmp/coverage
    entrypoint: ["./dockerize","-wait=tcp://discovery-server:8761","-timeout=60s","--","java", "${COV_AGENT_ARGS}", "org.springframework.boot.loader.JarLauncher"]

  tracing-server:
    image: openzipkin/zipkin
    container_name: tracing-server
    mem_limit: 512M
    networks:
      - demo-net
    environment:
    - JAVA_OPTS=-XX:+UnlockExperimentalVMOptions -Djava.security.egd=file:/dev/./urandom
    ports:
     - 9411:9411

  admin-server:
    image: springcommunity/spring-petclinic-admin-server
    container_name: admin-server
    mem_limit: 512M
    networks:
      - demo-net
    depends_on:
     - config-server
     - discovery-server
    entrypoint: ["./dockerize","-wait=tcp://discovery-server:8761","-timeout=60s","--","java", "org.springframework.boot.loader.JarLauncher"]
    ports:
     - 9099:9090
networks:
  demo-net:
    external: true
    name: demo-net
