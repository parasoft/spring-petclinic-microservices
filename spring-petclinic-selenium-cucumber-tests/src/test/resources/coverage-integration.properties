# Parasoft CTP endpoint, including the CTP context path.
parasoft.coverage.integration.ctp.url=http://localhost:8070/em

# Default CTP environment for this project.
# Override for a developer-specific environment with:
# -Dparasoft.coverage.integration.ctp.envId=<environment ID>
parasoft.coverage.integration.ctp.envId=4

# Multi-user coverage identifier used by the CTP agents.
parasoft.coverage.integration.ctp.userId=seleniumCucumberJUnit-admin

# Sequential execution is the default.
# Set this to true only when Cucumber parallel execution is also enabled.
parasoft.coverage.integration.parallel.test.enabled=false

# DTP session tag used when the completed coverage session is published.
parasoft.coverage.integration.dtp.sessionTag=seleniumCucumberJUnit-admin-1

# CTP authentication.
parasoft.coverage.integration.ctp.auth.username=admin
parasoft.coverage.integration.ctp.auth.password=admin
