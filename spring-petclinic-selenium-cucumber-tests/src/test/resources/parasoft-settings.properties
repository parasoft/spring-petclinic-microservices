# Parasoft CTP/DTP Integration Properties
# ---------------------------------------
# This file configures Parasoft test environment integration for Java-based test frameworks.

# CTP server base URL (e.g., http://ctp-server:8080)
CTP_BASE_URL=http://localhost:8070

# Optional CTP context path if CTP is deployed to a custom context path that is not /em (e.g., /ctp)
#CTP_CONTEXT_PATH=/em

# CTP environment ID (integer, e.g., 1)
CTP_ENV_ID=4

# CTP authentication credentials
CTP_USERNAME=admin
CTP_PASSWORD=admin

# Set whether your coverage agent deployments are single-user or multi-user mode (true/false)
CTP_MULTI_USER_MODE=true

# Enable parallel test execution (true/false)
# Note: CTP_PARALLEL_TEST_EXECUTION=true requires CTP_MULTI_USER_MODE=true. Running parallel tests in single-user mode is an invalid configuration because concurrent tests cannot be distinguished by the coverage agents when they are in single-user mode.
# Note: Parallel test execution is not yet implemented for this module, so this property must be set to false for Cucumber tests.
CTP_PARALLEL_TEST_EXECUTION=false

# Proxy configuration for header injection
PROXY_HOST=192.168.5.135
PROXY_BIND_HOST=0.0.0.0

# Coverage publishing settings (true/false)
CTP_PUBLISH_COVERAGE=true

# Baseline publishing settings for Test Impact Analysis (true/false)
CTP_PUBLISH_BASELINE=false
CTP_BASELINE_BUILD_ID=spring-petclinic-baseline

# Test Framework, Selenium Grid and headless mode settings
TESTFRAMEWORK=seleniumCucumberJUnit
SELENIUM_GRID=false
SELENIUM_GRID_URL=http://localhost:4444/wd/hub
HEADLESS=false

# Logging level for Parasoft integration (ERROR, WARN, INFO, DEBUG, TRACE)
CTP_LOG_LEVEL=INFO